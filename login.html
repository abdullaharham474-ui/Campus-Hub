{% extends "base.html" %}{% block content %}<div class="card form-card"><span class="eyebrow">Welcome back</span><h1>Sign in</h1><p class="muted">Enter your account details to continue.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Email address</label><input type="email" name="email" required placeholder="name@example.com">
<label>Password</label><input type="password" name="password" required placeholder="Your password">
<button class="btn" type="submit">Sign in</button></form><p class="muted">New student? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
