{% extends "base.html" %}{% block content %}<div class="card form-card"><span class="eyebrow">Student portal</span><h1>Create account</h1><p class="muted">Register to access your campus dashboard.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Full name</label><input name="name" maxlength="100" required placeholder="Your full name">
<label>Email address</label><input type="email" name="email" maxlength="150" required placeholder="name@example.com">
<label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters">
<button class="btn" type="submit">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
